<!--🚀 3D - El Caos en Tercera Dimensión-->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 3D - El Caos en Tercera Dimensión</title>
<style>
* { margin: 0; padding: 0; overflow: hidden; }
body { background: blue; }

#joystickContainer {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 100;
}

#joystickBase {
    position: fixed;
    bottom: 100px;
    left: 100px;
    width: 120px;
    height: 120px;
    border-radius: 60px;
    background: rgba(255,255,255,0.3);
    border: 2px solid white;
}

#joystickThumb {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 25px;
    background: rgba(255,255,255,0.8);
    top: 35px;
    left: 35px;
}

</style>
</head>
<body>
  <div id="joystickContainer">
    <div id="joystickBase">
        <div id="joystickThumb"></div>
    </div>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
<script>
    // Activar consola visual en iPhone
    var vConsole = new VConsole();
    
    // También puedes capturar errores manualmente
    window.onerror = function(msg, url, line, col, error) {
        console.error('ERROR:', msg, 'en línea', line);
        return false;
    };
</script>
<script src="script.js" type="module"></script>
</body>
</html>
